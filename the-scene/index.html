<!doctype html>
<!-- The Scene's public page was retired on 2026-11-11 (it now lives at a private, password-protected address).
     Anyone following an old link to /the-scene/ is sent to the homepage instead of seeing a "not found" error.
     Once the Brazalete page exists, this can point to /brazalete/ instead. -->
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Keep this forwarding page out of search results. -->
<meta name="robots" content="noindex">
<!-- Send the visitor to the homepage immediately (0 seconds). -->
<meta http-equiv="refresh" content="0; url=/">
<!-- Tell search engines the homepage is the page that counts now. -->
<link rel="canonical" href="https://aerolex.dev/">
<title>AeroLex</title>
</head>
<body>
<!-- Fallback for the rare browser that ignores the automatic redirect. -->
<p><a href="/">Continue to aerolex.dev</a></p>
</body>
</html>

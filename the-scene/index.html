<!doctype html>
<!-- The Scene's public page was retired on 2026-11-11 (it now lives at a private, password-protected address).
     Anyone following an old link to /the-scene/ is sent to the Brazalete page (the public part of The Scene's work)
     instead of seeing a "not found" error. Changed from the homepage to /brazalete/ once that page existed. -->
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Keep this forwarding page out of search results. -->
<meta name="robots" content="noindex">
<!-- Send the visitor to the Brazalete page immediately (0 seconds). -->
<meta http-equiv="refresh" content="0; url=/brazalete/">
<!-- Tell search engines the Brazalete page is the page that counts now. -->
<link rel="canonical" href="https://aerolex.dev/brazalete/">
<title>AeroLex</title>
</head>
<body>
<!-- Fallback for the rare browser that ignores the automatic redirect. -->
<p><a href="/brazalete/">Continue to the Brazalete</a></p>
</body>
</html>

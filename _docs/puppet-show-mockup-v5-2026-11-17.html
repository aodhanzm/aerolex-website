<!doctype html>
<!-- ROUGH MOCKUP v5, 17 Nov 2026. No panning. The home scene is one forest stage with three miniature dioramas ("the tree with its
     skirt and presents"): the Sanctum (star-cloth skirt, Greek column altar, estate gate), the Brazalete (a glass lagoon pod),
     Hanyu Courtyard (a red lacquer estate gate with lions and a kettle). Click one: its gate opens, the other two are hoisted away
     on ropes, the lights dim, the old set is carried off and a whole new set (backdrop tarp, flats, props, lamp colour) comes in.
     In each realm the links are set pieces you click. EXIT returns. Everything is drawn in code as a stand-in. -->

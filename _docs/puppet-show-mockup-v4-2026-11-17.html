<!doctype html>
<!-- ROUGH MOCKUP v4, 17 Nov 2026. The proscenium (valance, drapes, side strips, light rig) NEVER moves. Everything behind it is a
     set that gets CHANGED, like a musical: the lights dim, the props wheel off on wagons, the flats lift away, the painted
     backdrop tarp lifts out, then a new backdrop drops in, new flats and props wheel on, and new colour gels come up.
     The home scene is the forest; it has three gateways (Sanctum left, Brazalete centre, Hanyu right) reached by moving the
     mouse to an edge. Each gateway changes the whole stage into that project's scene, with its own lights and set pieces.
     Everything is drawn in code as a stand-in for painted plywood and printed tarps. A design sketch, not the real site. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AeroLex stage mockup v4: scene changes</title>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=IM+Fell+English:ital@0;1&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0f0808;overflow:hidden}

  .gate,a,button,.tab{cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='38' height='38' viewBox='0 0 38 38'><path d='M13 4c2 0 3 1 3 3v8l2-1c2-1 4 0 4 2l2-1c2-1 4 0 4 2l1 8c0 5-3 9-9 9h-4c-4 0-6-2-8-6l-4-8c-1-2 1-4 3-3l3 2V7c0-2 1-3 3-3Z' fill='%23fff7e0' stroke='white' stroke-width='3' paint-order='stroke' stroke-linejoin='round'/><path d='M13 4c2 0 3 1 3 3v8l2-1c2-1 4 0 4 2l2-1c2-1 4 0 4 2l1 8c0 5-3 9-9 9h-4c-4 0-6-2-8-6l-4-8c-1-2 1-4 3-3l3 2V7c0-2 1-3 3-3Z' fill='%23fff7e0' stroke='%232b1d14' stroke-width='1.3' stroke-linejoin='round'/></svg>") 14 4,pointer}
  #stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:#140c08}
  .wrap{position:absolute;left:0;top:0;width:1280px;height:720px;overflow:visible}
  .wrap>svg,.wrap>.inner{position:absolute;left:0;top:0;display:block}
  svg{display:block}
  svg.fixed{position:absolute;left:0;top:0;pointer-events:none}
  .gate{pointer-events:auto}
  #setroot{position:absolute;inset:0;overflow:hidden;clip-path:inset(0 100px 0 100px)}

  #wash{position:absolute;inset:0;z-index:6;pointer-events:none;mix-blend-mode:soft-light;opacity:.8;background:radial-gradient(ellipse at 50% -10%,var(--gel,#ffe6a8) 0%,transparent 75%);transition:background .4s steps(4)}

  #dim{position:absolute;inset:0;z-index:7;pointer-events:none;background:#06030a;opacity:0;transition:opacity .5s steps(5)}

  .note{position:absolute;left:112px;bottom:8px;z-index:12;color:#efe2c0;font:400 11px 'DM Sans';opacity:.85;max-width:430px}

<script>

/* ---------- painted plywood pieces ---------- */
function flat(svg,id,d,fill){const g=E('g',{filter:`url(#lift${id})`},svg);E('path',{d,fill:'#d6a869',stroke:INK,'stroke-width':3,transform:'translate(6 8)'},g);E('path',{d,fill,stroke:INK,'stroke-width':3.2,'stroke-linejoin':'round'},g);E('path',{d,fill:`url(#brush${id})`},g);return g}

  for(let i=0;i<tiers;i++){const ty=base-h*.16-i*(h*.74/tiers),tw=w*(1-i*.62/tiers),th=h*.74/tiers*1.55;let d=`M${x-tw/2} ${ty}`;const n=5;for(let k=1;k<=n;k++){d+=` L${x-tw/2+tw*k/n-tw/n*.5} ${ty-th*.12} L${x-tw/2+tw*k/n} ${ty}`}

/* =====================================================================================================================
   SCENES. Each builder returns { layers:[{el,kind}], gel, lamp, pan }.  kind decides how that layer rolls on and off.

const SCENES={};

/* ---------- HOME: the forest, three gateways ---------- */
SCENES.hub=function(){const out={pan:true,gel:'#ffe6a8',layers:[]};const f={back:.2,far:.5,mid:.75,props:1,near:1.15},Wd={};for(const k in f)Wd[k]=Math.round(1280+f[k]*1520);
  const back=layer(Wd.back);{const s=back._svg,W=Wd.back;s.insertAdjacentHTML('beforeend',`<defs><linearGradient id="sk${s.id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1e2a5e"/><stop offset=".3" stop-color="#52639f"/><stop offset=".5" stop-color="#9fd0d6"/><stop offset=".7" stop-color="#f0c995"/><stop offset="1" stop-color="#d9684a"/></linearGradient><linearGradient id="fd${s.id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#f3e6b4" stop-opacity=".55"/></linearGradient></defs>`);

  const mid=layer(Wd.mid);{const s=mid._svg,W=Wd.mid;pine(s,s.id,W*.34,640,560,G1,{tiers:5});pine(s,s.id,W*.66,640,560,G2,{tiers:5});roundTree(s,s.id,W*.1,640,420,'#d49a35','#f0cf74');roundTree(s,s.id,W*.9,640,420,'#c4553a','#eea17c');pine(s,s.id,W*.2,640,300,G2);pine(s,s.id,W*.5-250,640,240,G1);pine(s,s.id,W*.5+250,640,240,G1);pine(s,s.id,W*.8,640,300,G3)}
  const props=layer(Wd.props);{const s=props._svg,W=Wd.props;floor(s,s.id,W,'#a97a46',[[504,'#ec5f8f'],[1400,'#3fb6e0'],[2296,'#58c25a']]);
    /* three gateways: an arched opening in the treeline, with a painted glimpse of the path and the place beyond */
    [[504,'THE SANCTUM','sanctum','night'],[1400,'THE BRAZALETE','brazalete','day'],[2296,'HANYU COURTYARD','hanyu','dusk']].forEach(([x,t,go,mood])=>{
      const g=E('g',{class:'gate','data-go':go},s),ff=E('g',{filter:`url(#lift${s.id})`},g);const top=396,R2=110,base=606;

      E('path',{d:arch,fill:'#d6a869',stroke:INK,'stroke-width':3,transform:'translate(8 9) scale(1.12)',style:`transform-origin:${x}px ${base}px`},ff);
      E('path',{d:arch,fill:'#8a5a2c',stroke:INK,'stroke-width':4,transform:`translate(0 0)`,style:`transform-origin:${x}px ${base}px;transform:scale(1.12)`},ff);

      const sky={night:['#1e2a5e','#52639f'],day:['#7fd2e6','#e8f6ee'],dusk:['#d9684a','#f6c58b']}[mood];

  E('rect',{x:112,y:150,width:1056,height:8,fill:'#3a2c24',stroke:INK,'stroke-width':2},f);
  window.__lamps=[];for(let i=0;i<7;i++){const x=200+i*146;const g=E('g',{},f);E('rect',{x:x-6,y:158,width:12,height:12,fill:'#3a2c24',stroke:INK},g);E('path',{d:`M${x-22} 190 L${x-14} 170 L${x+14} 170 L${x+22} 190Z`,fill:'#2b2018',stroke:INK,'stroke-width':2},g);window.__lamps.push(E('ellipse',{cx:x,cy:191,rx:20,ry:5,fill:'#ffe6a8',stroke:INK,'stroke-width':1.5},g))}}
function setGel(c){document.getElementById('stage').style.setProperty('--gel',c);window.__lamps.forEach(l=>l.setAttribute('fill',c))}

/* =====================================================================================================================
   THE STAGE MANAGER: builds a scene, wheels things on and off, pans the home scene.
   ===================================================================================================================== */
const stage=document.getElementById('stage'),root=document.getElementById('setroot');
function fit(){const k=Math.min(innerWidth/1280,innerHeight/720);stage.style.transform=`scale(${k})`;stage.style.left=(innerWidth-1280*k)/2+'px';stage.style.top=(innerHeight-720*k)/2+'px'}
addEventListener('resize',fit);fit();
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let current=null,name=null,p=.5,target=.5,running=false;
/* -- panning for the home scene (the mouse position sets a target; each layer moves a different amount) -- */
function apply(){if(!current||!current.pan)return;current.layers.forEach(([wr,kind,side,f])=>{const el=wr.querySelector(':scope>svg'),pr=wr.querySelector(':scope>.inner.sign');const x=-p*1520*f;wr.querySelectorAll(':scope>svg').forEach(e=>e.style.transform=`translateX(${x}px)`);if(wr._sign)wr._sign.style.transform=`translateX(calc(-50% + ${x}px)) rotate(-.6deg)`})}
function loop(){p+=(target-p)*.07;apply();document.getElementById('tabL').style.opacity=p<.12?0:1;document.getElementById('tabR').style.opacity=p>.88?0:1;document.querySelectorAll('.dot').forEach(d=>d.classList.toggle('on',Math.abs(+d.dataset.p-p)<.2));if(Math.abs(target-p)>.0004)requestAnimationFrame(loop);else running=false}
function kick(){if(!running){running=true;requestAnimationFrame(loop)}}
addEventListener('mousemove',e=>{if(name!=='hub'||stage.classList.contains('busy'))return;const r=stage.getBoundingClientRect(),t=((e.clientX-r.left)/r.width-.5)*2,a=Math.max(0,Math.abs(t)-.3)/.7;target=Math.max(0,Math.min(1,.5+Math.sign(t)*Math.min(a,1)*.5));kick()});
document.getElementById('tabL').onclick=()=>{target=0;kick()};document.getElementById('tabR').onclick=()=>{target=1;kick()};document.querySelectorAll('.dot').forEach(d=>d.onclick=()=>{target=+d.dataset.p;kick()});
addEventListener('keydown',e=>{if(name!=='hub')return;if(e.key==='ArrowLeft'){target=Math.max(0,target-.5);kick()}if(e.key==='ArrowRight'){target=Math.min(1,target+.5);kick()}});

/* -- the scene change: dim, wheel the props out, lift the flats and the tarp, then bring the new set in under new lights -- */
async function change(to){if(stage.classList.contains('busy'))return;stage.classList.add('busy');R=rng(to.length*17+3);
  const old=current;
  if(old){const L=old.layers,by=k=>L.find(l=>l[1]===k)[0];
    document.getElementById('note').textContent='Scene change: props wheel off, flats lift, backdrop tarp lifts out...';
    by('props').classList.add(by('props')===null?'':'rollL');await wait(0);
    by('near').classList.add('lift');by('mid').classList.add('lift','d1');by('far').classList.add('lift','d2');by('back').classList.add('lift','d3');
    await wait(1800);root.innerHTML=''}
  const sc=SCENES[to]();current=sc;name=to;setGel(sc.gel);
  /* new set arrives: backdrop drops first, then flats, then the props roll in on wagons from the wings */
  const order=['back','far','mid','props','near'],kind=Object.fromEntries(sc.layers.map(l=>[l[1],l[0]]));
  order.forEach(k=>root.appendChild(kind[k]));
  kind.back.classList.add('drop');kind.far.classList.add('drop','d1');kind.mid.classList.add('drop','d2');kind.near.classList.add('drop','d3');kind.props.classList.add(to==='hub'?'inR':'inL','d2');
  if(sc.pan){p=.5;target=.5;apply()}
  stage.classList.toggle('inproj',to!=='hub');
  document.getElementById('note').textContent=to==='hub'?'ROUGH MOCKUP v4. Move the mouse to an edge to pan, then click a gateway to change the whole set.':'Scene: '+to+'. Note the different lights, backdrop, flats and props. Use EXIT to go back to the forest.';
  await wait(1700);
  /* the arrival animations are finished: clear them so the next scene change can move these pieces again */
  sc.layers.forEach(l=>l[0].classList.remove('drop','inL','inR','d1','d2','d3'));stage.classList.remove('busy');
  root.querySelectorAll('.gate').forEach(g=>g.addEventListener('click',()=>change(g.dataset.go)))}
document.getElementById('exit').addEventListener('click',e=>{e.preventDefault();change('hub')});

/* -- the very first thing a visitor sees: the Welcome curtain, then the forest -- */
const intro=document.getElementById('intro');function open(){intro.classList.add('open');setTimeout(()=>{intro.remove();document.getElementById('plaque').remove()},1900)}
change('hub').then(()=>{});setTimeout(open,2400);intro.addEventListener('click',open);
</script></body></html>
